<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>🎂 Happy Birthday!</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .container {
        width: 90%;
        max-width: 600px;
        text-align: center;
        padding: 35px 20px;
        border-radius: 25px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        position: relative;
        z-index: 10;
    }

    .cake {
        font-size: 80px;
        animation: bounce 1.5s infinite;
        margin-bottom: 10px;
    }

    h1 {
        font-size: clamp(2.2rem, 10vw, 4.5rem);
        margin-bottom: 10px;
        text-shadow: 0 0 15px rgba(255,255,255,0.8);
        animation: glow 2s infinite alternate;
    }

    h2 {
        font-size: clamp(1.4rem, 6vw, 2.5rem);
        margin-bottom: 20px;
    }

    p {
        font-size: clamp(1rem, 4vw, 1.3rem);
        line-height: 1.6;
        margin-bottom: 25px;
    }

    button {
        border: none;
        padding: 14px 25px;
        border-radius: 50px;
        background: white;
        color: #d63384;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.08);
        background: #ffe6f2;
    }

    .heart {
        position: fixed;
        bottom: -20px;
        font-size: 20px;
        animation: floatUp 5s linear forwards;
        pointer-events: none;
        z-index: 5;
    }

    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -20px;
        z-index: 20;
        pointer-events: none;
        animation: fall linear forwards;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-15px);
        }
    }

    @keyframes glow {
        from {
            text-shadow: 0 0 10px white;
        }
        to {
            text-shadow: 0 0 30px #fff,
                         0 0 50px #ffeb3b;
        }
    }

    @keyframes fall {
        0% {
            transform: translateY(-20px) rotate(0deg);
            opacity: 1;
        }

        100% {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0);
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        100% {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }

    @media (max-width: 480px) {
        .container {
            padding: 30px 15px;
        }

        .cake {
            font-size: 65px;
        }

        button {
            width: 90%;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <h2>🥳 Dear <span id="name">My Friend</span> ❤️</h2>

    <p>
        May your special day be filled with
        <strong>happiness, laughter, love and success.</strong>
        ✨
    </p>

    <p>
        May every new chapter of your life
        bring beautiful memories and amazing opportunities.
        🌟
    </p>

    <button onclick="celebrate()">
        🎉 Celebrate! 🎉
    </button>

</div>

<script>

    // Change the birthday person's name here
    const birthdayName = "My Friend";

    document.getElementById("name").textContent = birthdayName;


    // Create confetti
    function createConfetti() {

        const colors = [
            "#ff3838",
            "#ffdd00",
            "#00e5ff",
            "#7cff00",
            "#ff4ecd",
            "#ffffff",
            "#ff8c00"
        ];

        for (let i = 0; i < 120; i++) {

            const confetti = document.createElement("div");

            confetti.classList.add("confetti");

            confetti.style.left =
                Math.random() * 100 + "vw";

            confetti.style.background =
                colors[Math.floor(Math.random() * colors.length)];

            confetti.style.width =
                Math.random() * 8 + 5 + "px";

            confetti.style.height =
                Math.random() * 8 + 5 + "px";

            confetti.style.animationDuration =
                Math.random() * 3 + 3 + "s";

            confetti.style.animationDelay =
                Math.random() * 2 + "s";

            confetti.style.transform =
                `rotate(${Math.random() * 360}deg)`;

            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, 6000);
        }
    }


    // Floating hearts
    function createHeart() {

        const heart = document.createElement("div");

        heart.classList.add("heart");

        const hearts = ["❤️", "💖", "💕", "💗", "💓", "✨"];

        heart.innerHTML =
            hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.fontSize =
            Math.random() * 20 + 15 + "px";

        heart.style.animationDuration =
            Math.random() * 3 + 4 + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 7000);
    }


    // Button celebration
    function celebrate() {

        createConfetti();

        for (let i = 0; i < 15; i++) {
            setTimeout(createHeart, i * 100);
        }
    }


    // Start celebration automatically
    window.onload = function() {

        createConfetti();

        setInterval(createHeart, 700);

    };

</script>

</body>
</html>
